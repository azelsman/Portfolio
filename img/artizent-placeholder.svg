<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Artizent case-study image placeholder</title>
  <desc id="desc">A neutral violet placeholder indicating where a final case-study visual will appear.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#201634"/>
      <stop offset="1" stop-color="#5a2ca0"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#background)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect x="250" y="195" width="1100" height="510" rx="28" fill="none" stroke="#ffffff" stroke-opacity=".45" stroke-width="4" stroke-dasharray="18 14"/>
  <text x="800" y="425" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700" text-anchor="middle">ARTIZENT / INSURITY</text>
  <text x="800" y="500" fill="#ffffff" fill-opacity=".78" font-family="Arial, Helvetica, sans-serif" font-size="32" text-anchor="middle">CASE-STUDY VISUAL PLACEHOLDER</text>
</svg>
