<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Artizent case-study tile placeholder</title>
  <desc id="desc">A square violet placeholder for the future Artizent case-study tile image.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#201634"/>
      <stop offset="1" stop-color="#5a2ca0"/>
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
    </pattern>
  </defs>
  <rect width="1024" height="1024" fill="url(#background)"/>
  <rect width="1024" height="1024" fill="url(#grid)"/>
  <rect x="132" y="132" width="760" height="760" rx="24" fill="none" stroke="#ffffff" stroke-opacity=".45" stroke-width="4" stroke-dasharray="18 14"/>
  <text x="512" y="478" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" text-anchor="middle">ARTIZENT / INSURITY</text>
  <text x="512" y="545" fill="#ffffff" fill-opacity=".78" font-family="Arial, Helvetica, sans-serif" font-size="28" text-anchor="middle">TILE IMAGE PLACEHOLDER</text>
</svg>
